<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tám Khô · Quản lý Game</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#163d4b">
<link rel="icon" href="icon-192.png">
<style>
 :root{--kem:#fbf4e4;--teal:#163d4b;--cam:#ea5d36;--do:#c83228;--xanh:#0d7a4f;--vien:#e2d4b7}
 *{box-sizing:border-box}
 body{margin:0;background:var(--kem);color:var(--teal);
      font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
 header{background:var(--teal);color:var(--kem);padding:12px 16px;display:flex;
        justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
 header b{letter-spacing:.5px}
 .gio{font-size:12px;opacity:.75}
 main{padding:16px;max-width:1200px;margin:0 auto}
 .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
 .o{background:#fff;border:2px solid var(--vien);border-radius:14px;padding:12px 14px}
 .o .so{font-size:30px;font-weight:800;line-height:1.1}
 .o .nh{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
 .kho{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
 .kho .o .so{font-size:22px;color:var(--xanh)}
 .kho .o .so.het{color:var(--do)}
 .thanh{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
 input,button{font:inherit;border-radius:10px;border:1.5px solid var(--vien);padding:10px 12px}
 input{flex:1;min-width:180px}
 button{font-weight:700;cursor:pointer;border:0}
 .chinh{background:var(--teal);color:#fff}
 .phu{background:#fff;border:1.5px solid var(--vien);color:var(--teal)}
 table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
 th,td{padding:9px 11px;text-align:left;border-bottom:1px solid #f0e8d6;font-size:13.5px}
 th{background:#f3ead6;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
 td.ma{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--cam)}
 tr:last-child td{border-bottom:0}
 .trong{text-align:center;padding:40px;opacity:.55;font-weight:600}
 #cong{max-width:340px;margin:60px auto;background:#fff;border:2px solid var(--vien);
       border-radius:16px;padding:22px;text-align:center}
 #cong h2{margin:0 0 4px;font-size:19px}
 #cong p{font-size:13px;opacity:.7;margin:0 0 14px}
 #cong input{width:100%;text-align:center;font-size:24px;letter-spacing:8px;margin-bottom:10px}
 #cong button{width:100%}
 .loi{color:var(--do);font-weight:700;font-size:13px;min-height:18px}
 .an{display:none}
</style>
</head>
<body>

<div id="cong">
  <h2>Quản lý Game Tám Khô</h2>
  <p>Nhập mã quản lý để xem số liệu</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="····">
  <div class="loi" id="loi"></div>
  <button class="chinh" onclick="vao()">VÀO</button>
</div>

<div id="app" class="an">
  <header>
    <div><b>TÁM KHÔ · QUẢN LÝ GAME</b><div class="gio" id="gio">đang tải…</div></div>
    <button class="phu" onclick="thoat()">Đổi mã</button>
  </header>
  <main>
    <div class="kpi">
      <div class="o"><div class="so" id="k1">–</div><div class="nh">Lượt chơi hôm nay</div></div>
      <div class="o"><div class="so" id="k2">–</div><div class="nh">Khách hôm nay</div></div>
      <div class="o"><div class="so" id="k3">–</div><div class="nh">Mã đã phát hôm nay</div></div>
    </div>
    <div class="kho" id="kho"></div>
    <div class="thanh">
      <input id="tim" placeholder="Tìm theo số điện thoại, tên khách hoặc mã…" autocomplete="off">
      <button class="chinh" onclick="nap()">TÌM</button>
      <button class="phu" onclick="document.getElementById('tim').value='';nap()">Hôm nay</button>
      <button class="phu" onclick="xuat()">Xuất Excel</button>
    </div>
    <div id="bang"></div>
  </main>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycby9QW_ZaYyzIzAhEK3vm5m_gKrPqIV93q7Iqhh9aiQAZjfVXMVBPlDqlzEBW57J7bRI3w/exec';
let pin='', duLieu=[];

function luu(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function doc(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

async function goi(body){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
                           body:JSON.stringify(body)});
  return r.json();
}

async function vao(){
  const p=document.getElementById('pin').value.trim();
  const loi=document.getElementById('loi');
  if(!p){loi.textContent='Chưa nhập mã';return}
  loi.textContent='đang kiểm tra…';
  try{
    const r=await goi({action:'QUAN_LY',pin:p});
    if(!r.ok){loi.textContent=r.error==='SAI_PIN'?'Mã không đúng':('Lỗi: '+r.error);return}
    pin=p; luu('tk_pin',p); moApp(r);
  }catch(e){loi.textContent='Không nối được máy chủ. Kiểm tra mạng.'}
}

function thoat(){pin='';luu('tk_pin','');location.reload()}

function moApp(r){
  document.getElementById('cong').classList.add('an');
  document.getElementById('app').classList.remove('an');
  ve(r);
  setInterval(nap,30000);
}

async function nap(){
  if(!pin)return;
  try{
    const r=await goi({action:'QUAN_LY',pin:pin,tuKhoa:document.getElementById('tim').value});
    if(r.ok)ve(r);
  }catch(e){document.getElementById('gio').textContent='mất mạng, đang thử lại…'}
}

function ve(r){
  duLieu=r.ds||[];
  document.getElementById('gio').textContent='cập nhật '+r.gio;
  document.getElementById('k1').textContent=r.luotHomNay;
  document.getElementById('k2').textContent=r.khachHomNay;
  document.getElementById('k3').textContent=r.maHomNay;
  document.getElementById('kho').innerHTML=(r.kho||[]).map(k=>
    '<div class="o"><div class="so'+(k.con===0?' het':'')+'">'+k.con+' mã</div>'
    +'<div class="nh">'+esc(k.ten)+'</div>'
    +'<div class="nh" style="opacity:.5">đã phát '+k.daPhat+'</div></div>').join('');
  document.getElementById('bang').innerHTML = duLieu.length
    ? '<table><thead><tr><th>Giờ chơi</th><th>Tên khách</th><th>Số điện thoại</th>'
      +'<th>Giải trúng</th><th>Mã voucher</th><th>Game</th><th>Zalo</th></tr></thead><tbody>'
      +duLieu.map(x=>'<tr><td>'+esc(x.luc)+'</td><td>'+esc(x.ten||'–')+'</td><td>'+esc(x.sdt)
      +'</td><td>'+esc(x.giai)+'</td><td class="ma">'+esc(x.ma||'–')+'</td><td>'+esc(x.game)
      +'</td><td>'+esc(x.zalo)+'</td></tr>').join('')+'</tbody></table>'
    : '<div class="trong">Chưa có lượt chơi nào</div>';
}

function xuat(){
  if(!duLieu.length){alert('Chưa có dữ liệu để xuất');return}
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['Gio_choi','Ten_khach','So_dien_thoai','Giai_trung','Ma_voucher','Game','Nhan_Zalo']];
  duLieu.forEach(x=>rows.push([x.luc,x.ten,x.sdt,x.giai,x.ma,x.game,x.zalo].map(q)));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.join(',')).join('\n')],
         {type:'text/csv;charset=utf-8'}));
  a.download='khach-choi-game-tam-kho-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();a.remove();
}

document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')vao()});
document.getElementById('tim').addEventListener('keydown',e=>{if(e.key==='Enter')nap()});

(async()=>{
  const p=doc('tk_pin');
  if(p){document.getElementById('pin').value=p;await vao()}
})();

if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
